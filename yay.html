<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yay Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fef3f3;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        h1 {
            font-size: 80px;
            color: #ff4f7b;
            margin: 0;
            z-index: 10;
        }

        .small-text {
            font-size: 22px;
            color: #ff4f7b;
            margin-top: 10px;
            z-index: 10;
        }

        .flower {
            position: absolute;
            font-size: 40px;
            animation: bounce 3s infinite ease-in-out, float 10s infinite linear;
            opacity: 0.8;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
        }

        @keyframes float {
            0% { transform: translateX(-10vw); }
            100% { transform: translateX(110vw); }
        }
    </style>
</head>
<body>

    <h1>yay 😘</h1>
    <div class="small-text">luv you ❤️</div>

    <!-- Floating flowers -->
    <div class="flower" style="top: 10%; left: -20%; animation-delay: 0s;">🌸</div>
    <div class="flower" style="top: 30%; left: -30%; animation-delay: 1s;">🌼</div>
    <div class="flower" style="top: 60%; left: -25%; animation-delay: 2s;">🌺</div>
    <div class="flower" style="top: 80%; left: -15%; animation-delay: 0.5s;">🌸</div>
    <div class="flower" style="top: 50%; left: -35%; animation-delay: 1.5s;">🌼</div>

</body>
</html>
