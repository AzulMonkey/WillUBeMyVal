<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Example GitHub Pages site">
    <title>My GitHub Pages Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            background: #007acc;
            color: white;
            padding: 1rem 0;
        }
        main {
            padding: 2rem;
        }
        footer {
            background: #222;
            color: #ccc;
            padding: 1rem 0;
            font-size: 0.9rem;
        }
        a {
            color: #007acc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My GitHub Pages Site</h1>
    </header>

    <main>
        <p>This is a simple example of an <strong>index.html</strong> file hosted on GitHub Pages.</p>
        <p>You can edit this file to customize your site.</p>
        <p>
            Learn more about GitHub Pages at 
            <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">
                pages.github.com
            </a>.
        </p>
    </main>

    <footer>
        &copy; <span id="year"></span> My GitHub Pages Example
    </footer>

    <script>
        // Dynamically set the current year in the footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
